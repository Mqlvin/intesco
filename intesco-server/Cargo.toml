[package]
name = "intesco-server"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
mime_guess = "2.0.5"
reqwest = { version = "0.13.2", features = ["gzip", "json", "query"] }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors"] }
